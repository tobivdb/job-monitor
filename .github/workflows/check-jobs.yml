name: Check Job Postings

on:
  schedule:
    # Runs at 07:00 UTC = 09:00 CEST / 08:00 CET every day
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      email_test:
        description: Send a fast SMTP test without scanning career sites
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/check-jobs.yml'
      - 'job_monitor.py'
      - 'tests/**'

permissions:
  contents: write  # Needed to commit state.json back

concurrency:
  group: job-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate Python and run regression tests
        run: |
          python -m py_compile job_monitor.py
          python -m unittest discover -s tests -v

  check-jobs:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EMAIL_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.email_test || false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ "$EMAIL_TEST" != "true" ]; then
            playwright install chromium
            playwright install-deps chromium
          fi

      - name: Run job monitor
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: smtp.gmail.com
          SMTP_PORT: 587
          LINKEDIN_COOKIES: ${{ secrets.LINKEDIN_COOKIES }}
          # CV-pipeline feed (optional): same secrets as the Job-Tracker-Update repo.
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN || secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_CV_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_CV_FOLDER_ID }}
        run: |
          if [ "$EMAIL_TEST" = "true" ]; then
            python job_monitor.py --config config.github.json --email-test
          else
            python job_monitor.py --config config.github.json --always-email
          fi

      - name: Upload fallback report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: job-monitor-fallback-report
          path: last_report.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Save state
        if: env.EMAIL_TEST != 'true'
        run: |
          git config user.name "Job Monitor Bot"
          git config user.email "bot@job-monitor"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update state.json [skip ci]"
            git pull --rebase origin main
            git push
          fi
